title: VSS Shadow Copy Deletion
id: ee5d4f3c-0e77-52ad-8f9d-51f7c1110f54
status: experimental
description: Flags vss shadow copy deletion for triage; behavior-based, not proof of compromise.
author: Custom Detection Engineering Lab
date: '2026-10-14'
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \vssadmin.exe
    CommandLine|contains: delete shadows
  condition: selection
fields:
- Image
- CommandLine
- ParentImage
- User
- Computer
falsepositives:
- Storage administrators may delete snapshots.
level: high
tags:
- attack.t1490
