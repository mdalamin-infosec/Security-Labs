title: Rundll32 Comsvcs MiniDump Usage
id: 22f51e8b-3b27-5b2a-afb2-40fd0d232ff7
status: experimental
description: Flags rundll32 comsvcs minidump usage for triage; behavior-based, not proof of compromise.
author: Custom Detection Engineering Lab
date: '2026-10-14'
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \rundll32.exe
    CommandLine|contains: MiniDump
  condition: selection
fields:
- Image
- CommandLine
- ParentImage
- User
- Computer
falsepositives:
- Debugging tools may generate authorized dumps.
level: high
tags:
- attack.t1003.001
