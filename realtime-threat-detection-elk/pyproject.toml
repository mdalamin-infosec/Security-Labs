[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "threatwatch-lab"
version = "1.0.0"
description = "Suricata and Elastic Stack detection pipeline with incident triage tooling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
threatwatch = "threatwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["threatwatch*"]

[tool.setuptools.package-data]
threatwatch = ["data/*.rules"]
