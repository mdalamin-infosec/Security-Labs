# ThreatWatch Lab: Suricata -> Filebeat -> Elasticsearch -> Kibana (single-node lab stack).
# Security is disabled for local lab use only. Ports bind to 127.0.0.1. See SECURITY.md.
name: threatwatch

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  suricata:
    image: jasonish/suricata:7.0.7
    # Host networking and raw-socket capabilities are required to sniff a host interface.
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    # -S loads only the local rules. Add suricata-update later for broader coverage.
    command: ["-i", "${SURICATA_IFACE:-eth0}", "-S", "/etc/suricata/rules/local.rules", "-v"]
    volumes:
      - ../src/threatwatch/data/local.rules:/etc/suricata/rules/local.rules:ro
      - suricata-logs:/var/log/suricata
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - suricata-logs:/var/log/suricata:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es-data:
  suricata-logs:
