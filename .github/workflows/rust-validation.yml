name: Rust application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [vulnerable-app, secure-app]
    defaults:
      run:
        working-directory: secure-code-review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup component add clippy --toolchain stable
          rustc +stable --version
          cargo +stable --version
      - run: cargo +stable check --locked --manifest-path src/${{ matrix.app }}/Cargo.toml
      - run: cargo +stable clippy --locked --manifest-path src/${{ matrix.app }}/Cargo.toml
