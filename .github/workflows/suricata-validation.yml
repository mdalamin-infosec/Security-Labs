name: Offline Suricata engine validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install actual engine and PCAP tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends suricata
          python -m pip install -r sigma-suricata-detection-rules/requirements.txt -r sigma-suricata-detection-rules/requirements-pcap.txt
          suricata --build-info
      - name: Validate standalone IDS syntax
        working-directory: network-intrusion-detection-suricata
        run: |
          mkdir -p outputs/config-check
          suricata -T -c configs/suricata-lab.yaml -S rules/local.rules -l outputs/config-check
      - name: Replay Sigma project's HTTP and DNS cases
        working-directory: sigma-suricata-detection-rules
        run: |
          python tools/generate_pcaps.py
          python tools/replay_suricata.py --config configs/suricata-lab.yaml
          python -c "import json; r=json.load(open('outputs/suricata_metrics.json')); assert all(c['detected'] == (c['label'] == 'attack') for c in r['cases']), r"
      - name: Replay ELK project's eight signatures and benign DNS control
        working-directory: realtime-threat-detection-elk
        run: bash tests/pcap/run_suricata_pcap.sh
